name: Refresh OCR lockfile

on:
  push:
    branches: [mizan-production-platform]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mizan-production-platform
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- bun.lock; then
            echo 'No lockfile changes.'
            exit 0
          fi
          git add bun.lock
          git commit -m 'chore: refresh bun lockfile for OCR dependency'
          git push origin HEAD:mizan-production-platform
